name: 🚀 Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════
  # Windows 桌面版 (PyInstaller)
  # ═══════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy Frontend to Backend
        shell: pwsh
        run: |
          Copy-Item -Path frontend/dist/* -Destination backend/static/ -Recurse -Force

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd backend
          python -m PyInstaller --onefile --name SoulMate --add-data "static;static" --add-data "services;services" --add-data "routes;routes" --add-data "models;models" --add-data "middleware;middleware" --add-data "config.py;." --add-data "database.py;." --hidden-import=passlib.handlers.bcrypt --hidden-import=slowapi --collect-all slowapi app.py

      - name: Create NSIS Installer
        shell: pwsh
        run: |
          # Copy exe for NSIS
          Copy-Item -Path backend/dist/SoulMate.exe -Destination scripts/SoulMate.exe

          # Install NSIS with full path
          choco install nsis -y --no-progress
          $env:Path += ";C:\Program Files (x86)\NSIS"
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsisPath)) {
            # Try alternate location
            $nsisPath = Get-ChildItem "C:\Program Files*" -Filter "makensis.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $nsisPath) {
            Write-Host "❌ NSIS not found"
            exit 1
          }
          Write-Host "NSIS found at: $nsisPath"

          # Build installer
          cd scripts
          & $nsisPath installer.nsi
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ NSIS build failed"
            exit 1
          }

          # Verify
          if (Test-Path SoulMate-Setup.exe) {
            Write-Host "✅ Installer built: $((Get-Item SoulMate-Setup.exe).Length) bytes"
          } else {
            Write-Host "❌ Installer not found"
            exit 1
          }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SoulMate-Windows
          path: scripts/SoulMate-Setup.exe
          if-no-files-found: error

  # ═══════════════════════════════════════════════
  # macOS 桌面版 (PyInstaller)
  # ═══════════════════════════════════════════════
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy Frontend to Backend
        run: cp -r frontend/dist/* backend/static/

      - name: Install & Build
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller
          python -m PyInstaller --onefile --name SoulMate \
            --add-data "static:static" \
            --add-data "services:services" \
            --add-data "routes:routes" \
            --add-data "models:models" \
            --add-data "middleware:middleware" \
            --add-data "config.py:." \
            --add-data "database.py:." \
            --hidden-import=passlib.handlers.bcrypt \
            --hidden-import=slowapi \
            --collect-all slowapi \
            app.py

      - name: Package for macOS
        run: |
          mkdir -p SoulMate.app/Contents/MacOS
          cp backend/dist/SoulMate SoulMate.app/Contents/MacOS/
          cat > SoulMate.app/Contents/MacOS/launch.sh << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          open "http://localhost:8000"
          exec "$DIR/SoulMate"
          EOF
          chmod +x SoulMate.app/Contents/MacOS/launch.sh SoulMate.app/Contents/MacOS/SoulMate
          cp .env.example SoulMate.app/Contents/MacOS/
          zip -r SoulMate-macOS.zip SoulMate.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulMate-macOS
          path: SoulMate-macOS.zip

  # ═══════════════════════════════════════════════
  # Linux 桌面版 (PyInstaller)
  # ═══════════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy Frontend to Backend
        run: cp -r frontend/dist/* backend/static/

      - name: Install & Build
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller
          python -m PyInstaller --onefile --name SoulMate \
            --add-data "static:static" \
            --add-data "services:services" \
            --add-data "routes:routes" \
            --add-data "models:models" \
            --add-data "middleware:middleware" \
            --add-data "config.py:." \
            --add-data "database.py:." \
            --hidden-import=passlib.handlers.bcrypt \
            --hidden-import=slowapi \
            --collect-all slowapi \
            app.py

      - name: Package for Linux
        run: |
          mkdir -p SoulMate-linux
          cp backend/dist/SoulMate SoulMate-linux/
          cp .env.example SoulMate-linux/
          cat > SoulMate-linux/start.sh << 'EOF'
          #!/bin/bash
          echo "💝 SoulMate starting..."
          echo "Open http://localhost:8000 in your browser"
          DIR="$(cd "$(dirname "$0")" && pwd)"
          "$DIR/SoulMate"
          EOF
          chmod +x SoulMate-linux/start.sh SoulMate-linux/SoulMate
          tar -czf SoulMate-Linux.tar.gz SoulMate-linux

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulMate-Linux
          path: SoulMate-Linux.tar.gz

  # ═══════════════════════════════════════════════
  # Android APK
  # ═══════════════════════════════════════════════
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Capacitor
        run: |
          cd frontend
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install -D typescript

      - name: Init Capacitor Android
        run: |
          cd frontend
          # Clean any previous attempt
          rm -rf android .capacitor
          # Create fresh Capacitor project (mjs config is picked up automatically)
          npx cap init SoulMate app.soulmate.mobile --web-dir=dist
          npx cap add android

      - name: Configure Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > frontend/android/local.properties
          # Increase Gradle memory
          mkdir -p frontend/android/gradle
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> frontend/android/gradle.properties

      - name: Build APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulMate-Android
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ═══════════════════════════════════════════════
  # Docker Image
  # ═══════════════════════════════════════════════
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t soulmate:latest .

      - name: Test Docker Image
        run: |
          docker run -d --name soulmate-test -p 18000:8000 soulmate:latest
          sleep 5
          curl -f http://localhost:18000/api/health || echo "Health check failed but continuing"
          docker stop soulmate-test || true

  # ═══════════════════════════════════════════════
  # Create GitHub Release
  # ═══════════════════════════════════════════════
  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show Artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: SoulMate ${{ github.ref_name || inputs.version }}
          draft: false
          prerelease: false
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## 🚀 SoulMate ${{ github.ref_name || inputs.version }}

            AI 情感陪伴应用 — 开源、私密、温暖。

            ### 📦 下载安装

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | 🪟 **Windows** | `SoulMate-Setup.exe` | 双击安装，桌面会出现 SoulMate 图标 |
            | 🍎 **macOS** | `SoulMate-macOS.zip` | 解压后双击 `SoulMate.app` |
            | 🐧 **Linux** | `SoulMate-Linux.tar.gz` | 解压后运行 `./start.sh` |
            | 📱 **Android** | `app-debug.apk` | 安装后配置服务器地址 |
            | 🐳 **Docker** | `docker pull` | `docker-compose up -d` |

            ### 🪟 Windows 安装步骤
            1. 下载 `SoulMate-Setup.exe`
            2. 双击运行安装程序
            3. 安装完成后桌面出现 SoulMate 图标
            4. 双击图标 → 浏览器自动打开 → 开始使用

            ### 🔑 首次使用
            1. 使用默认管理员账号登录：`admin@soulmate.app` / `admin123`
            2. 进入「设置」页面配置你的 API Key（OpenAI / Anthropic）
            3. 进入「角色」页面选择角色开始聊天
            4. 或者进入「模型」页面添加模型并测试连接

            ### 🔧 技术栈
            FastAPI + React + SQLite + Tailwind CSS
