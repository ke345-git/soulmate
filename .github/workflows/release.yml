name: 🚀 Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════
  # Windows 桌面版 (PyInstaller)
  # ═══════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy Frontend to Backend
        shell: pwsh
        run: |
          Copy-Item -Path frontend/dist/* -Destination backend/static/ -Recurse -Force

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd backend
          pyinstaller --onefile --name SoulMate --add-data "static;static" --add-data "services;services" --add-data "routes;routes" --add-data "models;models" --add-data "middleware;middleware" --add-data "config.py;." --add-data "database.py;." --hidden-import=passlib.handlers.bcrypt --hidden-import=slowapi --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops --hidden-import=uvicorn.protocols --collect-all slowapi app.py

      - name: Create Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/SoulMate -Force
          Copy-Item -Path backend/dist/SoulMate.exe -Destination release/SoulMate/
          Copy-Item -Path .env.example -Destination release/SoulMate/
          @"
          @echo off
          echo 💝 Starting SoulMate...
          echo.
          echo The app will open in your browser at http://localhost:8000
          echo Keep this window open while using SoulMate.
          echo.
          start "" "%~dp0SoulMate.exe"
          "@ | Out-File -FilePath release/SoulMate/启动SoulMate.bat -Encoding ASCII

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path release/SoulMate/* -DestinationPath release/SoulMate-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulMate-Windows
          path: release/SoulMate-Windows.zip

  # ═══════════════════════════════════════════════
  # macOS 桌面版 (PyInstaller)
  # ═══════════════════════════════════════════════
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy Frontend to Backend
        run: cp -r frontend/dist/* backend/static/

      - name: Install & Build
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onefile --name SoulMate \
            --add-data "static:static" \
            --add-data "services:services" \
            --add-data "routes:routes" \
            --add-data "models:models" \
            --add-data "middleware:middleware" \
            --add-data "config.py:." \
            --add-data "database.py:." \
            --hidden-import=passlib.handlers.bcrypt \
            --hidden-import=slowapi \
            --collect-all slowapi \
            app.py

      - name: Package as DMG
        run: |
          mkdir -p release/SoulMate.app/Contents/MacOS
          cp backend/dist/SoulMate release/SoulMate.app/Contents/MacOS/
          cp .env.example release/
          cd release && zip -r SoulMate-macOS.zip SoulMate.app .env.example

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulMate-macOS
          path: release/SoulMate-macOS.zip

  # ═══════════════════════════════════════════════
  # Linux 桌面版 (PyInstaller)
  # ═══════════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy Frontend to Backend
        run: cp -r frontend/dist/* backend/static/

      - name: Install & Build
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onefile --name SoulMate \
            --add-data "static:static" \
            --add-data "services:services" \
            --add-data "routes:routes" \
            --add-data "models:models" \
            --add-data "middleware:middleware" \
            --add-data "config.py:." \
            --add-data "database.py:." \
            --hidden-import=passlib.handlers.bcrypt \
            --hidden-import=slowapi \
            --collect-all slowapi \
            app.py

      - name: Package
        run: |
          mkdir -p release
          cp backend/dist/SoulMate release/
          cp .env.example release/
          cd release && tar -czf SoulMate-Linux.tar.gz SoulMate .env.example

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulMate-Linux
          path: release/SoulMate-Linux.tar.gz

  # ═══════════════════════════════════════════════
  # Android APK
  # ═══════════════════════════════════════════════
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Capacitor
        run: |
          cd frontend
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Init Capacitor Android
        run: |
          cd frontend
          # Clean any previous attempt
          rm -rf android .capacitor
          # Create fresh Capacitor project
          npx cap init SoulMate app.soulmate.mobile --web-dir=dist
          npx cap add android

      - name: Configure Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > frontend/android/local.properties
          # Increase Gradle memory
          mkdir -p frontend/android/gradle
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> frontend/android/gradle.properties

      - name: Build APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulMate-Android
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulMate-Android
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

  # ═══════════════════════════════════════════════
  # Docker Image
  # ═══════════════════════════════════════════════
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t soulmate:latest .

      - name: Test Docker Image
        run: |
          docker run -d --name soulmate-test -p 18000:8000 soulmate:latest
          sleep 5
          curl -f http://localhost:18000/api/health || echo "Health check failed but continuing"
          docker stop soulmate-test || true

  # ═══════════════════════════════════════════════
  # Create GitHub Release
  # ═══════════════════════════════════════════════
  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show Artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: SoulMate ${{ github.ref_name || inputs.version }}
          draft: false
          prerelease: false
          files: artifacts/**/*
          generate_release_notes: true
