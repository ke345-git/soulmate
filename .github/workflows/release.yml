name: 🚀 Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  # ═══════════════════════════════════════════════
  # Windows 桌面版 (PyInstaller)
  # ═══════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy Frontend to Backend
        shell: pwsh
        run: |
          Copy-Item -Path frontend/dist/* -Destination backend/static/ -Recurse -Force

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd backend
          python -m PyInstaller --onefile --name SoulMate --add-data "static;static" --add-data "portraits;portraits" --add-data "services;services" --add-data "routes;routes" --add-data "models;models" --add-data "middleware;middleware" --add-data "config.py;." --add-data "database.py;." --hidden-import=passlib.handlers.bcrypt --hidden-import=slowapi --collect-all slowapi app.py

      - name: Create NSIS Installer
        shell: pwsh
        run: |
          # Copy exe for NSIS
          Copy-Item -Path backend/dist/SoulMate.exe -Destination scripts/SoulMate.exe

          # Install NSIS with full path
          choco install nsis -y --no-progress
          $env:Path += ";C:\Program Files (x86)\NSIS"
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsisPath)) {
            # Try alternate location
            $nsisPath = Get-ChildItem "C:\Program Files*" -Filter "makensis.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $nsisPath) {
            Write-Host "❌ NSIS not found"
            exit 1
          }
          Write-Host "NSIS found at: $nsisPath"

          # Build installer
          cd scripts
          & $nsisPath installer.nsi
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ NSIS build failed"
            exit 1
          }

          # Verify
          if (Test-Path SoulMate-Setup.exe) {
            Write-Host "✅ Installer built: $((Get-Item SoulMate-Setup.exe).Length) bytes"
          } else {
            Write-Host "❌ Installer not found"
            exit 1
          }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SoulMate-Windows
          path: scripts/SoulMate-Setup.exe
          if-no-files-found: error

  # ═══════════════════════════════════════════════
  # macOS 桌面版 (PyInstaller)
  # ═══════════════════════════════════════════════
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy Frontend to Backend
        run: cp -r frontend/dist/* backend/static/

      - name: Install & Build
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller
          python -m PyInstaller --onefile --name SoulMate \
            --add-data "static:static" \
            --add-data "portraits:portraits" \
            --add-data "services:services" \
            --add-data "routes:routes" \
            --add-data "models:models" \
            --add-data "middleware:middleware" \
            --add-data "config.py:." \
            --add-data "database.py:." \
            --hidden-import=passlib.handlers.bcrypt \
            --hidden-import=slowapi \
            --collect-all slowapi \
            app.py

      - name: Package for macOS
        run: |
          mkdir -p SoulMate.app/Contents/MacOS
          cp backend/dist/SoulMate SoulMate.app/Contents/MacOS/
          cat > SoulMate.app/Contents/MacOS/launch.sh << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          open "http://localhost:8000"
          exec "$DIR/SoulMate"
          EOF
          chmod +x SoulMate.app/Contents/MacOS/launch.sh SoulMate.app/Contents/MacOS/SoulMate
          cp .env.example SoulMate.app/Contents/MacOS/
          zip -r SoulMate-macOS.zip SoulMate.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulMate-macOS
          path: SoulMate-macOS.zip

  # ═══════════════════════════════════════════════
  # Linux 桌面版 (PyInstaller)
  # ═══════════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy Frontend to Backend
        run: cp -r frontend/dist/* backend/static/

      - name: Install & Build
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller
          python -m PyInstaller --onefile --name SoulMate \
            --add-data "static:static" \
            --add-data "portraits:portraits" \
            --add-data "services:services" \
            --add-data "routes:routes" \
            --add-data "models:models" \
            --add-data "middleware:middleware" \
            --add-data "config.py:." \
            --add-data "database.py:." \
            --hidden-import=passlib.handlers.bcrypt \
            --hidden-import=slowapi \
            --collect-all slowapi \
            app.py

      - name: Package for Linux
        run: |
          mkdir -p SoulMate-linux
          cp backend/dist/SoulMate SoulMate-linux/
          cp .env.example SoulMate-linux/
          cat > SoulMate-linux/start.sh << 'EOF'
          #!/bin/bash
          echo "💝 SoulMate starting..."
          echo "Open http://localhost:8000 in your browser"
          DIR="$(cd "$(dirname "$0")" && pwd)"
          "$DIR/SoulMate"
          EOF
          chmod +x SoulMate-linux/start.sh SoulMate-linux/SoulMate
          tar -czf SoulMate-Linux.tar.gz SoulMate-linux

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulMate-Linux
          path: SoulMate-Linux.tar.gz

  # ═══════════════════════════════════════════════
  # Android APK
  # ═══════════════════════════════════════════════
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Capacitor
        run: |
          cd frontend
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Add Capacitor Android Platform
        run: |
          cd frontend
          # 使用仓库提交的 capacitor.config.json（appId 等已在其中），无需重新 init
          rm -rf android .capacitor
          npx cap add android

      - name: Configure Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > frontend/android/local.properties
          # Increase Gradle memory
          mkdir -p frontend/android/gradle
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> frontend/android/gradle.properties

      - name: Build APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulMate-Android
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ═══════════════════════════════════════════════
  # Docker Image
  # ═══════════════════════════════════════════════
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/soulmate:latest
            ghcr.io/${{ github.repository_owner }}/soulmate:${{ github.ref_name || inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════
  # Create GitHub Release
  # ═══════════════════════════════════════════════
  create-release:
    needs: [build-windows, build-macos, build-linux, build-android, build-docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "v=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "v=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Download Artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          path: artifacts

      - name: Show Artifacts
        run: find artifacts -type f

      - name: Rename Artifacts
        run: |
          mkdir -p release-assets
          # Windows
          find artifacts -name "SoulMate-Setup.exe" -exec cp {} release-assets/SoulMate-Windows-Setup.exe \;
          # macOS
          find artifacts -name "SoulMate-macOS.zip" -exec cp {} release-assets/SoulMate-macOS.zip \;
          # Linux
          find artifacts -name "SoulMate-Linux.tar.gz" -exec cp {} release-assets/SoulMate-Linux.tar.gz \;
          # Android
          find artifacts -name "app-debug.apk" -exec cp {} release-assets/SoulMate-Android.apk \;
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: SoulMate ${{ steps.version.outputs.v }}
          tag_name: ${{ github.ref_name || inputs.version }}
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## 🚀 SoulMate ${{ steps.version.outputs.v }}

            AI 情感陪伴应用 — 开源、私密、温暖。

            ### 📦 下载安装

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | 🪟 **Windows** | `SoulMate-Windows-Setup.exe` | 双击安装，桌面会出现 SoulMate 图标 |
            | 🍎 **macOS** | `SoulMate-macOS.zip` | 解压后双击 `SoulMate.app` |
            | 🐧 **Linux** | `SoulMate-Linux.tar.gz` | 解压后运行 `chmod +x SoulMate && ./SoulMate` |
            | 📱 **Android** | `SoulMate-Android.apk` | 安装后配置服务器地址 |
            | 🐳 **Docker** | `ghcr.io/${{ github.repository_owner }}/soulmate:${{ steps.version.outputs.v }}` | `docker pull` 即可 |

            ### 🪟 Windows 安装步骤
            1. 下载 `SoulMate-Windows-Setup.exe`
            2. 双击运行安装程序
            3. 安装完成后桌面出现 SoulMate 图标
            4. 双击图标 → 浏览器自动打开 → 开始使用

            ### 🐳 Docker 部署
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/soulmate:${{ steps.version.outputs.v }}
            docker run -d -p 8000:8000 -v soulmate-data:/app/data ghcr.io/${{ github.repository_owner }}/soulmate:${{ steps.version.outputs.v }}
            ```

            ### 🔑 首次使用
            1. 使用默认管理员账号登录：`admin@soulmate.app` / `admin123`
            2. 进入「设置」页面配置你的 API Key（OpenAI / Anthropic）
            3. 进入「角色」页面选择角色开始聊天
            4. 或者进入「模型」页面添加模型并测试连接

            ### 🔧 技术栈
            FastAPI + React + SQLite + Tailwind CSS
