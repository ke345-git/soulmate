  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - soulmate
  #   networks:
  #     - soulmate-network

networks:
  soulmate-network:
    driver: bridge
