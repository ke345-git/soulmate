services:
  soulmate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soulmate
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./.env:/app/.env:ro
    environment:
      - APP_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - soulmate-network

  # Nginx 反向代理（可选，需要时取消注释）
  # nginx:
  #   image: nginx:alpine
